<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#174c3e"><title>IQRA — читать и помнить</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head><body><div id="root"><main class="loginPage"><div class="loginArt"><span class="eyebrow light">187 ИСТОРИЙ · 1 131 ВОПРОС</span><h1>Читать.<br><em>Понимать.</em><br>Помнить.</h1></div><section class="loginForm"><div class="wordmark">IQRA</div><h2>С возвращением</h2><p class="muted">Твоя ежедневная практика.</p><form id="login"><label>Логин<input id="username" autocomplete="username" value="nazar" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><p id="error" role="alert"></p><button id="enter" class="primary full">Войти</button></form><small>Независимая версия. Материалы зашифрованы паролем. Прогресс хранится в этом браузере. Размещено на GitHub Pages. Автоматические уведомления недоступны.</small></section></main></div><script>
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('enter');button.disabled=true;button.textContent='Открываем…';try{if(document.getElementById('username').value.trim()!=='nazar')throw Error();const cfg=await(await fetch('./config.json')).json();const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(cfg.salt),iterations:310000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(cfg.iv)},key,await(await fetch('./app.enc')).arrayBuffer());const code=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();document.getElementById('password').value='';const script=document.createElement('script');const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));script.src=url;script.onload=()=>URL.revokeObjectURL(url);document.body.append(script);}catch(err){document.getElementById('error').textContent='Не удалось войти. Проверь логин, пароль и подключение.';button.disabled=false;button.textContent='Войти';}};
</script></body></html>
